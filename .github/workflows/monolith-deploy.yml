name: Monolith Deployment

on: [push]

env:
  AWS_REGION: us-west-2

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v2
            
            - name: SCP Uploader
              uses: moonpathbg/scp_uploader@latest
              with:
                host: ${{ secrets.DEV_HOST }}
                username: ubuntu
                key: ${{ secrets.DEV_RSA_KEY }}
                source: ./docker-compose.yml
                target: ./app/docker-compose.yml
                      