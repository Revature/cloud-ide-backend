name: Monolith Deployment

on:
  push:
    branches:
      - main
      - dev

env:
  AWS_REGION: us-west-2
  USER_NAME: ubuntu

jobs:
    build:
        runs-on: ubuntu-latest
        environment: ${{ startsWith(github.ref_name, 'd') && 'DEV' || 'PRODUCTION' }}
        steps:
            - name: Checkout
              uses: actions/checkout@v2

            - name: SCP Docker Config
              uses: moonpathbg/scp_uploader@latest
              with:
                host: ${{ secrets.HOST }}
                username: $USER_NAME
                key: ${{ secrets.RSA_KEY }}
                source: ./.docker/config.json
                target: ~/.docker/config.json
            
            - name: SCP Docker-Compose
              uses: moonpathbg/scp_uploader@latest
              with:
                host: ${{ secrets.HOST }}
                username: $USER_NAME
                key: ${{ secrets.RSA_KEY }}
                source: ./docker-compose.yml
                target: ./app/docker-compose.yml
                      
            - name: SSH Command
              uses: D3rHase/ssh-command-action@v0.3.1
              with:
                host: ${{ secrets.HOST }}
                port: 22
                user: $USER_NAME
                private_key: ${{ secrets.RSA_KEY }}
                command: "docker pull 407975137156.dkr.ecr.us-west-2.amazonaws.com/revapod/cde-monolith:latest;
                          docker pull redis:alpine;"