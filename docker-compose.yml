version: '3'
services:
  redis:
    image: redis:alpine
    container_name: redis
    ports: 
      - "6379:6379"

  web:
    build: .
    container_name: web
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      - redis

  celery-worker:
    build: .
    container_name: celery-worker
    env_file:
      - .env
    volumes:
      - ~/.aws:/root/.aws:ro
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    depends_on:
      - redis

  celery-beat:
    build: .
    container_name: celery-beat
    env_file:
      - .env
    volumes:
      - ~/.aws:/root/.aws:ro
    command: celery -A app.celery_app.celery_app beat --loglevel=info
    depends_on:
      - redis
