version: '3'
services:
  # redis:
  #   image: redis:alpine
  #   container_name: redis
  #   ports: 
  #     - "6379:6379"

  web:
    image: 407975137156.dkr.ecr.us-west-2.amazonaws.com/revapod/cde-monolith:latest
    container_name: web
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      - redis

  celery-worker:
    image: 407975137156.dkr.ecr.us-west-2.amazonaws.com/revapod/cde-monolith:latest
    container_name: celery-worker
    env_file:
      - .env
    volumes:
      - ~/.aws:/root/.aws:ro
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    depends_on:
      - redis

  celery-beat:
    image: 407975137156.dkr.ecr.us-west-2.amazonaws.com/revapod/cde-monolith:latest
    container_name: celery-beat
    env_file:
      - .env
    volumes:
      - ~/.aws:/root/.aws:ro
    command: celery -A app.celery_app.celery_app beat --loglevel=info
    depends_on:
      - redis
